<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kimi</title>
<style>
:root{--tx:#1f3f55;--glass:rgba(255,255,255,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#eaf6fa;--glass:rgba(255,255,255,.14)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,sans-serif;color:var(--tx);background:radial-gradient(circle at 50% 38%,#b4e2ee,#78b9cf 70%);display:flex;flex-direction:column;transition:background 1.5s}
body.night{background:radial-gradient(circle at 50% 38%,#2d4f6b,#13263a 75%);color:#eaf6fa}
#top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px 0}
#chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(6px);border-radius:20px;padding:5px 10px;font-size:13px}
.chip b{display:block;width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.18);overflow:hidden}
.chip i{display:block;height:100%;background:#4a76b0;transition:width .6s}
#pip{position:relative;width:96px;height:128px;border-radius:20px;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 18px rgba(0,40,70,.28);background:#5d86a0}
#pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
#ov{position:absolute;inset:0;width:100%;height:100%}
#pl2{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;color:#fff;background:rgba(0,0,0,.35);padding:2px}
#camb{position:absolute;inset:0;border:0;background:rgba(40,80,110,.85);color:#fff;font-size:13px;line-height:1.3;padding:8px}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;transition:padding .4s,transform 1.3s cubic-bezier(.3,.8,.3,1);margin-top:8px;padding:0 6vw}
body.chat #stage{padding-bottom:46vh}
#bot{height:88%;max-height:470px;width:auto;max-width:80vw;overflow:visible;touch-action:manipulation}
#all{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-9px)}}
#arm{transform-origin:226px 214px;animation:wv 2.8s ease-in-out infinite}
.ex #arm{animation:wv2 .45s ease-in-out infinite}
@keyframes wv{50%{transform:rotate(-8deg)}}
@keyframes wv2{50%{transform:rotate(-18deg)}}
#gx{animation:br 3.6s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.012,1.02)}}
.asleep #gx{animation-duration:6.5s}
.talk #hx{animation:bob .55s ease-in-out infinite alternate}
@keyframes bob{from{transform:rotate(-2deg) translateY(0)}to{transform:rotate(2deg) translateY(-3px)}}
.asleep #arm{animation:none}.asleep #all{animation-duration:6s}
.hop #all{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-34px) scale(1.03)}}
#head{transition:none}
.eye rect,.eye path{transition:opacity .15s}
#z{position:absolute;top:18%;right:12%;font-size:30px;opacity:0;transition:opacity .5s}
.asleep #z{opacity:1}
#bub{align-self:center;margin:6px 16px 14px;max-width:86%;min-width:76px;background:radial-gradient(circle at 30% 25%,#fff,#e4eaf0);color:#1f3f55;border-radius:28px 28px 28px 6px;padding:12px 18px;font-size:16px;box-shadow:0 8px 18px rgba(0,40,70,.2);text-align:center}
#dock{display:flex;justify-content:center;gap:12px;padding:8px 10px 26px}
.b{width:56px;height:56px;border:0;border-radius:50%;font-size:24px;background:radial-gradient(circle at 30% 25%,#fff,#dfe6ee);box-shadow:0 8px 16px rgba(0,40,70,.22),inset 0 -4px 8px rgba(0,0,0,.06)}
.b:active{transform:scale(.92)}
.b.on{background:radial-gradient(circle at 30% 25%,#fff,#9fe3b8);box-shadow:0 0 0 4px rgba(90,200,140,.55),0 8px 16px rgba(0,40,70,.22);animation:vp 1.6s ease-in-out infinite}
@keyframes vp{50%{box-shadow:0 0 0 10px rgba(90,200,140,.18),0 8px 16px rgba(0,40,70,.22)}}
#sheet{position:fixed;left:0;right:0;bottom:0;height:46vh;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(250,253,255,.96);color:#1f3f55;border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(0,30,60,.25);transform:translateY(105%);transition:transform .4s;display:flex;flex-direction:column;gap:8px}
body.chat #sheet{transform:none}
#sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
#back{border:0;background:#e6edf5;color:#1f3f55;border-radius:18px;padding:9px 16px;font-size:15px}
#sh span{font-size:14px;color:#4d6a80}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.35}
.r{background:#e6edf5;align-self:flex-start;border-bottom-left-radius:5px}
.u{background:#5a86b8;color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.in{display:flex;gap:8px}

.in button{width:46px;border:0;border-radius:50%;background:#5a86b8;color:#fff;font-size:18px}
.in button#cfgb{background:#e6edf5;font-size:20px}
[hidden]{display:none!important}
#cfg{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.4;padding:4px 2px}
#cfg small{color:#4d6a80;font-size:13px}
#cfg input{border:1px solid #c9d6e2;border-radius:14px;padding:12px 14px;font-size:16px;background:#fff;color:#1f3f55;width:100%}
#cfg .row{display:flex;gap:8px}
#cfg .row button{flex:1;border:0;border-radius:14px;padding:12px;font-size:15px;background:#5a86b8;color:#fff}
#cfg .row button#gdel{background:#e6edf5;color:#1f3f55}
#sbl{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 45%,#34477c,#111a35 85%);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:scale(.3);transform-origin:50% 40%;transition:transform 1.3s cubic-bezier(.3,.8,.3,1),opacity 1.1s}
body.sb #sbl{opacity:1;pointer-events:auto;transform:none}
body.sb #stage{transform:scale(1.5)}
#sbe{display:flex;gap:7vw;align-items:center;animation:sbd 11s ease-in-out infinite}
.be{--w:min(43vw,46vh);width:var(--w);height:calc(var(--w)*1.75);border-radius:calc(var(--w)*.5);background:linear-gradient(#fff 0%,#e2f1ff 35%,#a9d6ff 100%);box-shadow:0 0 90px 18px rgba(170,210,255,.45),0 0 24px 4px rgba(255,255,255,.35);position:relative;will-change:transform}
.be::after{content:"";position:absolute;left:20%;top:15%;width:30%;height:17%;border-radius:50%;background:#fff}
.be::before{content:"";position:absolute;right:20%;bottom:16%;width:14%;height:8%;border-radius:50%;background:#fff;opacity:.85}
@keyframes sbb{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.05)}96%{transform:scaleY(.75)}}
@keyframes sbd{0%,100%{transform:translate(0,0)}30%{transform:translate(2.5vw,-1.5vh)}65%{transform:translate(-2.5vw,1vh)}}
#sbh{position:absolute;bottom:calc(5vh + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:rgba(255,255,255,.35)}
.tm.bk{animation:bk .5s steps(2) infinite}@keyframes bk{50%{opacity:.25}}
#mdot{position:fixed;top:calc(4px + env(safe-area-inset-top,0px));left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#5ac88c;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}#mdot.on{opacity:.8}
.sw{position:relative;display:flex;align-items:center;gap:4px;height:56px;padding:0 10px;border-radius:28px;font-size:22px;background:radial-gradient(circle at 30% 25%,#fff,#dfe6ee);box-shadow:0 8px 16px rgba(0,40,70,.22),inset 0 -4px 8px rgba(0,0,0,.06)}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw i{width:36px;height:22px;border-radius:11px;background:#b8c2cf;position:relative;transition:.2s}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:#4cc57f}.sw input:checked+i::after{left:16px}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
let S={name:'',hunger:80,energy:80,love:60,mem:[],log:[],tm:[],facts:[],asleep:false,t:Date.now()};
try{const x=localStorage.getItem('robotito2');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{S.t=Date.now();try{localStorage.setItem('robotito2',JSON.stringify(S))}catch(e){}};
const cl=v=>Math.max(0,Math.min(100,v));
const mins=(Date.now()-S.t)/60000;S.hunger=cl(S.hunger-mins*.1);S.love=cl(S.love-mins*.05);S.energy=cl(S.energy+(S.asleep?mins*.5:-mins*.05));
/* ---------- cara y ojos ---------- */
let viaTexto=false,vSue=0,mood='',moodT,wink=0,blink=0,talkOpen=false,talkT=0,talkI=0,talkId=0,gOcupado=0,gUlt='';
function setMood(m,ms=2400){mood=m;face();reaccion(m);clearTimeout(moodT);moodT=setTimeout(()=>{mood='';face()},ms)}
function eyeKind(side){ // o=abierto a=feliz h=corazon
 if(S.asleep)return 'o';if(wink&&side==='L')return 'a';
 if(mood==='love')return 'h';if(mood==='happy')return 'a';return 'o'}
function face(){
 ['L','R'].forEach(s=>{const k=eyeKind(s),g=$('e'+s);
  g.querySelectorAll('.o').forEach(n=>n.style.opacity=k==='o'?1:0);
  g.querySelectorAll('.a').forEach(n=>n.style.opacity=k==='a'?1:0);
  g.querySelectorAll('.h').forEach(n=>n.style.opacity=k==='h'?1:0);
  let sy=1;if(S.asleep)sy=.08;else if(blink)sy=.08;else if(mood==='yawn')sy=.12;else if(mood==='surprise')sy=1.15;else if(mood==='eat')sy=.8;else if(S.hunger<20||S.love<15||vSue>.6)sy=.8;
  const s2=$('e'+s+'s');s2.style.transformBox='fill-box';s2.style.transformOrigin='center';s2.style.transform=`scaleY(${sy})`;s2.style.transition='transform .09s'});
 let d='M138 150 Q150 160 162 150',b=0;
 if(S.asleep)d='M142 152 Q150 155 158 152';
 else if(mood==='yawn')d='M143 149 a7 11 0 1 0 14 0 a7 11 0 1 0 -14 0';
 else if(talkOpen)d='M136 148 Q150 174 164 148Z';
 else if(mood==='happy'||mood==='love'){d='M130 146 Q150 172 170 146';b=.8}
 else if(mood==='eat')d='M138 148 Q150 170 162 148Z';
 else if(mood==='surprise')d='M144 152 a6 8 0 1 0 12 0 a6 8 0 1 0 -12 0';
 else if(S.hunger<20||S.love<15)d='M138 158 Q150 146 162 158';
 else b=.25;
 $('mo').setAttribute('d',d);$('bl').style.opacity=$('br').style.opacity=b}
function ui(){$('h').style.width=S.hunger+'%';$('e').style.width=S.energy+'%';$('l').style.width=S.love+'%';
 const hr=new Date().getHours();document.body.classList.toggle('asleep',S.asleep);document.body.classList.toggle('night',S.asleep||hr>=21||hr<6);face()}
/* ---------- mirada: cámara > dedo > curiosidad ---------- */
let tx=0,ty=0,cx=0,cy=0,idle=0,faceOn=0;
function look(x,y){const r=$('bot').getBoundingClientRect();const dx=x-(r.left+r.width/2),dy=y-(r.top+r.height*.3),k=Math.hypot(dx,dy)||1,f=Math.min(1,k/160);tx=dx/k*f*12;ty=dy/k*f*8}
addEventListener('pointermove',e=>{idle=0;if(!faceOn)look(e.clientX,e.clientY)});
addEventListener('pointerdown',e=>{idle=0;if(!faceOn)look(e.clientX,e.clientY)});
let tick=0;
setInterval(()=>{tick++;idle++;
 if(!faceOn&&idle>30&&tick%60===0){tx=(Math.random()-.5)*22;ty=(Math.random()-.5)*10}
 cx+=(tx-cx)*.35;cy+=(ty-cy)*.35;
 $('eyes').setAttribute('transform',S.asleep?'':`translate(${cx.toFixed(2)} ${cy.toFixed(2)})`);
 $('head').style.transform=S.asleep?'rotate(7deg)':`rotate(${(cx*.45).toFixed(2)}deg) translate(${(cx*.5).toFixed(2)}px,${(cy*.35).toFixed(2)}px)`;
},50);
function doBlink(){if(!S.asleep){blink=1;face();setTimeout(()=>{blink=0;face()},120)}setTimeout(doBlink,2200+Math.random()*2600)}doBlink();
setInterval(()=>{if(!S.asleep&&!mood&&Math.random()<.25){wink=1;face();setTimeout(()=>{wink=0;face()},650)}},9000);
function hop(){document.body.classList.add('hop');setTimeout(()=>document.body.classList.remove('hop'),520)}
function excite(ms=2500){document.body.classList.add('ex');setTimeout(()=>document.body.classList.remove('ex'),ms)}
/* ---------- gestos y movimiento ---------- */
const gx=$('gx'),hx=$('hx'),brazo=$('arm');
const anim=(el,kf,ms,o)=>{try{return el.animate(kf,Object.assign({duration:ms,easing:'ease-in-out'},o||{}))}catch(e){}};
const G={
 balanceo(){anim(gx,[{transform:'rotate(0)'},{transform:'rotate(-4deg)'},{transform:'rotate(4deg)'},{transform:'rotate(-3deg)'},{transform:'rotate(0)'}],2600);anim(hx,[{transform:'rotate(0)'},{transform:'rotate(5deg)'},{transform:'rotate(-5deg)'},{transform:'rotate(3deg)'},{transform:'rotate(0)'}],2600)},
 curioso(){anim(hx,[{transform:'rotate(0)'},{transform:'rotate(-10deg) translateY(-2px)',offset:.3},{transform:'rotate(-10deg) translateY(-2px)',offset:.7},{transform:'rotate(0)'}],2400)},
 asentir(){anim(hx,[{transform:'translateY(0)'},{transform:'translateY(7px)'},{transform:'translateY(0)'},{transform:'translateY(7px)'},{transform:'translateY(0)'}],1300)},
 rebote(){anim(gx,[{transform:'translateY(0) scale(1,1)'},{transform:'translateY(0) scale(1.05,.93)',offset:.2},{transform:'translateY(-22px) scale(.97,1.05)',offset:.5},{transform:'translateY(0) scale(1.04,.95)',offset:.8},{transform:'translateY(0) scale(1,1)'}],900)},
 salto(){anim(gx,[{transform:'translateY(0) scale(1,1)'},{transform:'translateY(0) scale(1.07,.9)',offset:.18},{transform:'translateY(-48px) scale(.95,1.08)',offset:.5},{transform:'translateY(0) scale(1.06,.92)',offset:.82},{transform:'translateY(0) scale(1,1)'}],1000)},
 bailar(){anim(gx,[{transform:'rotate(0) translateY(0)'},{transform:'rotate(-7deg) translateY(-14px)'},{transform:'rotate(0) translateY(0)'},{transform:'rotate(7deg) translateY(-14px)'},{transform:'rotate(0) translateY(0)'}],900,{iterations:4});
  anim(hx,[{transform:'rotate(0)'},{transform:'rotate(8deg)'},{transform:'rotate(0)'},{transform:'rotate(-8deg)'},{transform:'rotate(0)'}],900,{iterations:4});excite(3700)},
 risa(){setMood('happy',1800);anim(gx,[{transform:'translateY(0) rotate(0)'},{transform:'translateY(-6px) rotate(-3deg)'},{transform:'translateY(0) rotate(3deg)'},{transform:'translateY(-6px) rotate(-3deg)'},{transform:'translateY(0) rotate(0)'}],360,{iterations:5})},
 bostezo(){setMood('yawn',1800);anim(gx,[{transform:'scale(1,1)'},{transform:'scale(1.02,1.07)',offset:.5},{transform:'scale(1,1)'}],1800)},

const VA={
 pasear(){const w=innerWidth*.22;vAns.push(anim($('bot'),[{transform:'none'},{transform:`translateX(${-w}px) rotate(-4deg)`,offset:.3},{transform:`translateX(${w}px) rotate(4deg)`,offset:.7},{transform:'none'}],5200));

  let x=60,y=60,vx=2.6,vy=0;const t0=Date.now();

   g.setAttribute('transform',`translate(${x} ${y}) rotate(${x*3})`);if(!faceOn){tx=(x-150)/150*12;ty=(y-120)/200*8}
   if(Date.now()-t0>6500){g.remove();ballEl=null;if(!faceOn){tx=0;ty=0}return}requestAnimationFrame(f)})();return 6500},
 asomar(){const s=Math.random()<.5?-1:1,w=innerWidth*.42*s;vAns.push(anim($('bot'),[{transform:'none'},{transform:`translateX(${w}px) rotate(${s*14}deg)`,offset:.35},{transform:`translateX(${w}px) rotate(${s*14}deg)`,offset:.7},{transform:'none'}],6000));mir(-s*8,0,2200);mir(0,0,5000);return 6000},
 corazones(){run('saludar');for(let i=0;i<5;i++)setTimeout(()=>{if(!vida)return;const h=document.createElementNS(NS,'path'),x=70+Math.random()*160;h.setAttribute('d','M0 8C-14-4-9-16 0-8C9-16 14-4 0 8Z');h.setAttribute('fill','#ff8fb8');$('bot').appendChild(h);
   const a=h.animate([{opacity:0,transform:`translate(${x}px,70px) scale(.6)`},{opacity:1,offset:.2},{opacity:0,transform:`translate(${x+(Math.random()-.5)*30}px,-20px) scale(1.3)`}],{duration:2200,easing:'ease-out'});a.onfinish=()=>h.remove()},i*450);return 3600},
 bailar(){run('bailar');return 3700},estirar(){run('estirar');return 1800},bostezo(){run('bostezo');return 1800},

function busca(){[-14,14,-8,0].forEach((x,i)=>mir(x,i==2?-6:-1,i*1300))}
setInterval(()=>{const n=Date.now(),q=n-Math.max(lastAct,lastSeen);

 if(!ok){if(vida)vidaFin();return}
 if(bd().contains('talk'))return;

 if(Math.abs(sue-vSue)>.1){vSue=sue;face()}
 if(!vida){vida=1;vNext=n+5200;busca();return}
 if(n<vNext)return;
 const op=vSue>.55?['bostezo','estirar','reloj','bostezo']:['pasear','pelota','asomar','corazones','bailar','estirar','bostezo','reloj'];
 let a;do{a=pick(op)}while(a===vUlt&&op.length>1);vUlt=a;

/* ---------- reloj y temporizadores ---------- */
let AC;function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i==1?988:784;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+d;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}}
const fmtD=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(c)}`:`${m}:${p(c)}`};
const hablaD=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,a=[];if(h)a.push(h+(h>1?' horas':' hora'));if(m)a.push(m+(m>1?' minutos':' minuto'));if(c&&!h)a.push(c+(c>1?' segundos':' segundo'));return a.join(' y ')||'un instante'};
const NW={un:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,quince:15,veinte:20,treinta:30};
function parseTm(l){let s=0,m;const re=/(\d+(?:[.,]\d+)?|[a-z]+)\s*(horas?|minutos?|min|segundos?|seg)\b/g;if(/media hora/.test(l))s+=1800;
 while(m=re.exec(l)){let n=parseFloat(m[1].replace(',','.'));if(isNaN(n))n=NW[m[1]];if(!n)continue;s+=n*(/^h/.test(m[2])?3600:/^m/.test(m[2])?60:1)}return s}
function ring(){const go=()=>{beep();try{navigator.vibrate&&navigator.vibrate([200,100,200,100,300])}catch(e){}run('bailar');say('¡Se acabó el tiempo! ⏰','happy')};
 if(sb){lastAct=Date.now();wake();setTimeout(go,1300)}else go()}
function addTm(s){s=Math.min(86400,Math.round(s));S.tm.push({id:Date.now(),fin:Date.now()+s*1000});save();tmTick()}
function tmTick(){$('clkt').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 const box=$('tms'),now=Date.now();[...box.children].forEach(e=>{if(!S.tm.some(t=>'tm'+t.id===e.id))e.remove()});
 S.tm.forEach(t=>{let e=$('tm'+t.id);if(!e){e=document.createElement('div');e.className='chip tm';e.id='tm'+t.id;box.appendChild(e)}
  if(t.fin>now)e.textContent='⏳ '+fmtD((t.fin-now)/1000);
  else if(!t.done){t.done=1;e.textContent='⏰ ¡Listo!';e.classList.add('bk');ring();setTimeout(()=>{S.tm=S.tm.filter(x=>x!==t);save();tmTick()},10000)}})}
{const n0=S.tm.length;S.tm=S.tm.filter(t=>t.fin>Date.now());if(S.tm.length<n0)setTimeout(()=>hi('Un temporizador terminó mientras la app estaba cerrada ⏰'),2500)}
tmTick();setInterval(tmTick,500);
setInterval(()=>{if(vc&&callAuto&&Date.now()-callT>callMs)vcOff(0,1)},1000);
/* ---------- comandos locales (sin Gemini) ---------- */
function cmdLocal(t){const l=t.toLowerCase(),d=new Date(),now=Date.now();let m;
 if(/adi[oó]s|hasta luego/.test(l)){say(pick(['¡Hasta luego! 👋','¡Nos vemos! Aquí estaré 💙']),'happy');run('saludar');if(vc)vcOff(0,1);return 1}
 if(/deja de escucharme|ya no me escuches/.test(l)){say('Está bien, me callo. Activa el interruptor 🎙️ si quieres que te escuche otra vez 🤫');vcOff(1,1);return 1}
 if(/qu[eé] hora es/.test(l)){say('Son las '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' ⏰');return 1}
 if(/qu[eé] d[ií]a (es|estamos)|qu[eé] fecha/.test(l)){say('Hoy es '+d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})+' 📅');return 1}
 if(/(cancel|quit|borr|elimin|apag|det[eé]n).*(temporizador|cron[oó]metro)/.test(l)){const n=S.tm.length;S.tm=[];save();tmTick();say(n?'Listo, cancelé el temporizador ✅':'No hay temporizadores activos');return 1}
 if(/cu[aá]nto falta|cu[aá]nto queda/.test(l)){const a=S.tm.filter(t=>t.fin>now).sort((x,y)=>x.fin-y.fin);say(a.length?'Faltan '+hablaD((a[0].fin-now)/1000)+' ⏳':'No tengo ningún temporizador activo');return 1}
 if(/temporizador|cron[oó]metro|av[ií]same|ponme.*(minuto|segundo|hora)/.test(l)){const s=parseTm(l);if(s>0){addTm(s);say(`Listo, ${hablaD(s)} ⏳`,'happy');return 1}return 0}
 if(m=l.match(/recuerda que (.+)/)){S.facts.push(t.slice(l.indexOf('recuerda que')+12).trim().slice(0,100));S.facts=S.facts.slice(-20);save();say('¡Anotado! Lo recordaré 📝','happy');return 1}
 if(/olvida todo/.test(l)){S.facts=[];save();say('Listo, olvidé todo lo que me pediste recordar.');return 1}
 if(/olvida eso/.test(l)){S.facts.pop();save();say('Listo, olvidé el último dato.');return 1}
 if(/qu[eé] recuerdas de m[ií]/.test(l)){say(S.facts.length?'Recuerdo: '+S.facts.join('. ')+'.':'Todavía no me has pedido recordar nada.');return 1}
 return 0}
/* ---------- palabra de activación "Kimi" ---------- */
const lev=(a,b)=>{const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]};
const esKimi=w=>{w=w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'');return /^[kqc]/.test(w)&&w.length>=3&&w.length<=6&&['kimi','quimi','kimmy'].some(k=>lev(w,k)<=1)};
function llamado(t){const p=t.split(/\s+/);for(let i=0;i<p.length;i++)if(esKimi(p[i]))return p.slice(i+1).join(' ').replace(/^[\s,.:;!¡?¿-]+/,'');return null}
function callOn(rest){if(!vc){vc=true;callAuto=1;callMs=30000;vcPause=0;vcFirst=0;$('vz').checked=true}callT=Date.now();wake();pantallaEncendida();
 if(rest.length>1)send(rest);else{say(pick(['¡Hola! Aquí estoy, dime 💙','¡Dime! Te escucho 👂','¡Aquí estoy! ¿Qué pasa?']),'surprise');run('saludar')}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
/* ---------- conversación por voz manos libres ---------- */
function vcListen(){
 if(!(vc||pas)||vcR)return;
 try{if(speechSynthesis.speaking){setTimeout(vcListen,500);return}}catch(e){}
 const r=new SR();r.lang='es-ES';r.continuous=false;r.interimResults=false;
 r.onstart=()=>{vcFirst=0;$('mdot').classList.add('on')};r.onspeechstart=()=>{lastVoice=Date.now();if(vc)run('curioso')};
 r.onresult=e=>{vcDelay=300;const t=((e.results[0]&&e.results[0][0])?e.results[0][0].transcript:'').trim();if(!t)return;
  if(vc){viaTexto=false;lastAct=callT=Date.now();wake();send(t);return}
  };
 r.onerror=e=>{
  if(e.error==='not-allowed'||e.error==='service-not-allowed'){
   if(vcFirst||!vc){vcOff(1,1);hi('No tengo permiso para el micrófono 🎤 ('+e.error+'). Actívalo en los permisos del navegador')}
   else{vcPause=1;hi('Toca la pantalla para que siga escuchándote 👆')}}
  else if(e.error==='network'){vcDelay=2500;if(vc)hi('Sin conexión para escucharte 📶 Reintento… ('+e.error+')')}
  else if(e.error!=='no-speech'&&e.error!=='aborted'){vcDelay=1000;if(vc)hi('No te pude escuchar bien ('+e.error+'). Reintento… 🎤')}};
 r.onend=()=>{$('mdot').classList.remove('on');if(vcR===r)vcR=null;if((vc||pas)&&!vcPause)setTimeout(vcListen,vcDelay)};
 vcR=r;try{r.start()}catch(e){vcR=null;if(vc&&!vcPause)setTimeout(vcListen,1000)}}
addEventListener('pointerdown',()=>{if(vc&&!vcR){vcPause=0;vcListen()}});
function vcOn(){viaTexto=false;vc=true;callAuto=0;vcPause=0;vcFirst=1;$('vz').checked=true;wake();pantallaEncendida();hi('Te escucho, habla cuando quieras 👂','surprise');vcListen()}
function vcOff(stop,quiet){vc=false;callAuto=0;if(stop)pas=0;$('vz').checked=false;if(vcR){try{vcR.abort()}catch(e){}vcR=null}
 if(!quiet)hi(stop?'Listo, ya no te escucho. Activa el interruptor 🎙️ para que vuelva a escucharte':'Listo, ya no te escucho 🎙️')}
if(SR){$('vz').onchange=()=>$('vz').checked?vcOn():vcOff(1);document.addEventListener('visibilitychange',()=>{if((vc||pas)&&document.visibilityState==='visible')vcListen()})}else $('vzs').style.display='none';
setInterval(()=>{S.hunger=cl(S.hunger-.5);S.love=cl(S.love-.2);S.energy=cl(S.asleep?S.energy+2:S.energy-.3);if(S.energy>=100)S.asleep=false;ui();save()},60000);

ui();gEstado();
setTimeout(()=>{say(S.name?`¡Volviste, ${S.name}! Te extrañé 💙`:'¡Hola! Soy Kimi 💙 Activa el interruptor 🎙️ para hablarme. ¿Cómo te llamas?','happy');hop();excite()},500);
